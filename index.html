<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGC - Central Global Capital</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#e8d5a1;font-family:'Inter',sans-serif;min-height:100vh}
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(800px at 20% 10%,#1a1405 0%,#080808 60%)}
.login-box{background:linear-gradient(145deg,#151515,#0c0c0c);border:1px solid #c9a86a;border-radius:18px;padding:36px 32px;width:92%;max-width:380px;text-align:center}
.login-box .cgc-logo{font-family:'Times New Roman',Times,serif;font-size:72px;font-weight:900;background:linear-gradient(145deg,#fff2a0,#d4b87a,#8a6d2e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box h2{font-family:'Times New Roman',serif;color:#FFF8E1;margin:8px 0 6px}
.login-box p{color:#C9A86A;font-size:13px;margin-bottom:20px}
.login-box input{width:100%;background:#0a0a0a;border:1px solid #c9a86a;border-radius:10px;padding:13px 14px;color:#e8d5a1;margin-bottom:12px;outline:none}
.login-box button{width:100%;background:linear-gradient(145deg,#d4b87a,#b8965a);border:none;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
#err{color:#ff6b6b;font-size:12px;margin-top:10px;display:none}
#app{display:none}

/* HEADER PERSIS FOTO */
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1.5px solid #c9a86a;background:#080808;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:0}
.header-left .cgc{font-family:'Times New Roman',Times,serif;font-size:58px;font-weight:700;color:#d4b87a;line-height:0.9;letter-spacing:1px;margin-right:18px}
.separator{width:1px;height:42px;background:rgba(201,168,106,0.4);margin-right:18px}
.header-titles .main{font-family:'Times New Roman',serif;color:#f0dca8;font-size:18px;font-weight:600;letter-spacing:0.3px}
.header-titles .sub{font-family:'Times New Roman',serif;color:#c9a86a;font-style:italic;font-size:15px;font-weight:400;margin-top:1px}
.header-right{display:flex;align-items:center;gap:20px}
.live-wrap{display:flex;align-items:center;gap:8px;margin-left:24px}
.live-dot{width:10px;height:10px;background:#ff2a2a;border-radius:50%;box-shadow:0 0 8px #ff2a2a,0 0 16px #ff2a2a;animation:blink 1s infinite;position:relative}
.live-dot::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;border:1px solid rgba(255,42,42,0.5);border-radius:50%;animation:pulse 1.5s infinite}
.live-text{font-size:12px;font-weight:700;color:#ff9a9a;letter-spacing:1px;border:1px solid rgba(201,168,106,.3);padding:3px 8px;border-radius:10px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(0.8);opacity:0.8}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.icon-btn{width:26px;height:26px;stroke:#c9a86a;fill:none;cursor:pointer;opacity:0.9}

.container{max-width:760px;margin:22px auto;padding:0 14px;display:flex;flex-direction:column;gap:18px}
.card{background:linear-gradient(145deg,#151515,#0a0a0a);border:1.5px solid #c9a86a;border-radius:16px;padding:22px 20px;box-shadow:0 4px 30px rgba(0,0,0,.6)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.label-small{font-family:'Times New Roman',serif;font-size:18px;letter-spacing:1px;font-weight:700;color:#e8d5a1}
.toggle{width:54px;height:28px;background:#2e8a5a;border-radius:20px;position:relative;cursor:pointer;box-shadow:0 0 10px rgba(46,138,90,.4)}
.toggle.off{background:#444}
.toggle-knob{width:22px;height:22px;background:#c8ffd8;border-radius:50%;position:absolute;top:3px;right:3px;transition:.3s}
.toggle.off .toggle-knob{right:29px;background:#aaa}
.client-name{font-family:'Times New Roman',serif;font-size:42px;font-weight:700;color:#f0dca8;margin:6px 0 16px}
.balance-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mini{background:rgba(0,0,0,.6);border:1px solid #c9a86a;border-radius:10px;padding:14px}
.mini .lbl{font-size:13px;color:#c9a86a;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mini .val{font-family:'Times New Roman',serif;font-size:32px;font-weight:700;color:#e8c88a}
.mini .val.profit{color:#a8d5a8}
.exp-row{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 0 16px;border-bottom:1px solid rgba(201,168,106,.2)}
.exp-info{font-size:13px;line-height:1.8;color:#c9a86a}
.btn-small{border:1px solid #c9a86a;background:transparent;color:#e8d5a1;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.btn-gold{background:linear-gradient(145deg,#d4b87a,#b8965a);color:#000;border:none;border-radius:10px;padding:13px;font-weight:700;cursor:pointer;font-size:15px}
.btn-outline{background:transparent;border:1.5px solid #c9a86a;color:#e8d5a1;border-radius:10px;padding:13px;font-weight:600;cursor:pointer;font-size:15px}
.form-title{font-family:'Times New Roman',serif;font-size:22px;font-weight:700;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{font-size:12px;margin-bottom:6px;display:block;opacity:.8}
.form-group input{width:100%;background:rgba(0,0,0,.6);border:1px solid #c9a86a;border-radius:9px;padding:12px;color:#e8d5a1;outline:none}
.btn-add{width:100%;margin-top:10px;background:linear-gradient(145deg,#d4b87a,#b8965a);color:#000;border:none;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="loginPage">
  <div class="login-box">
    <div class="cgc-logo">CGC</div>
    <h2>Central Global Capital</h2>
    <p>The best signal provider - Admin Login</p>
    <input id="user" value="admin">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="doLogin()">Login Admin</button>
    <div id="err">Salah! admin / CGC123</div>
  </div>
</div>
<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="cgc">CGC</div>
      <div class="separator"></div>
      <div class="header-titles">
        <div class="main">Central Global Capital</div>
        <div class="sub">The best signal provider</div>
      </div>
      <div class="live-wrap">
        <div class="live-dot"></div>
        <div class="live-text">LIVE</div>
      </div>
    </div>
    <div class="header-right">
      <svg class="icon-btn" viewBox="0 0 24 24" stroke-width="1.5"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      <svg class="icon-btn" viewBox="0 0 24 24" stroke-width="1.5"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <svg class="icon-btn" viewBox="0 0 24 24" stroke-width="1.5"><path d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
  </div>
  <div class="container" id="clientList"></div>
  <div class="container">
    <div class="card">
      <div class="form-title">Form Client Baru</div>
      <div class="form-group"><label>No Akun</label><input id="fAkun" placeholder="Masukkan nomor akun"></div>
      <div class="form-group"><label>Nama</label><input id="fNama" placeholder="Masukkan nama client"></div>
      <div class="form-group"><label>Tanggal Expired</label><input id="fExp" type="date"></div>
      <div class="form-group"><label>Sponsor</label><input id="fSponsor" placeholder="Masukkan sponsor (opsional)"></div>
      <button class="btn-add" onclick="tambahClient()">Tambahkan</button>
    </div>
  </div>
</div>
<script>
const ADMIN_USER="admin";const ADMIN_PASS="CGC123";
let clients=JSON.parse(localStorage.getItem('cgc_clients')||'null')||[{akun:"882910",nama:"Maesaroh",balance:85,profit:2.10,expired:"2024-10-12",sponsor:"Belum diisi",active:true}];
function doLogin(){const u=document.getElementById('user').value.trim();const p=document.getElementById('pass').value.trim();if(u===ADMIN_USER&&p===ADMIN_PASS){localStorage.setItem('cgc_login','1');showApp();}else{document.getElementById('err').style.display='block';}}
function showApp(){document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='block';renderClients();}
if(localStorage.getItem('cgc_login')==='1'){showApp();}
function formatExp(d){if(!d)return"-";const dt=new Date(d);return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function renderClients(){const list=document.getElementById('clientList');list.innerHTML='';clients.forEach((c,i)=>{const div=document.createElement('div');div.className='card';div.innerHTML=`<div class="card-top"><div class="label-small">DAFTAR CLIENT</div><div class="toggle ${c.active?'':'off'}" onclick="toggleClient(${i})"><div class="toggle-knob"></div></div></div><div class="client-name">${c.nama}</div><div class="balance-row"><div class="mini"><div class="lbl">Balance</div><div class="val">$${Number(c.balance).toFixed(2)}</div></div><div class="mini"><div class="lbl">Profit</div><div class="val profit">+$${Number(c.profit).toFixed(2)}</div></div></div><div class="exp-row"><div class="exp-info"><div>Expired: ${formatExp(c.expired)}</div><div>Sponsor: ${c.sponsor||'Belum diisi'}</div></div><button class="btn-small" onclick="editClient(${i})">Edit Client</button></div><div class="btn-row"><button class="btn-gold">Berlangganan</button><button class="btn-outline" onclick="hapusClient(${i})">Stop Sewa</button></div>`;list.appendChild(div);});}
function toggleClient(i){clients[i].active=!clients[i].active;save();}
function hapusClient(i){if(confirm('Stop sewa '+clients[i].nama+'?')){clients.splice(i,1);save();}}
function editClient(i){const c=clients[i];document.getElementById('fAkun').value=c.akun;document.getElementById('fNama').value=c.nama;document.getElementById('fExp').value=c.expired;document.getElementById('fSponsor').value=c.sponsor;clients.splice(i,1);save();}
function tambahClient(){const akun=document.getElementById('fAkun').value.trim();const nama=document.getElementById('fNama').value.trim();const exp=document.getElementById('fExp').value;const sponsor=document.getElementById('fSponsor').value.trim()||'Belum diisi';if(!akun||!nama||!exp){alert('Lengkapi!');return;}clients.unshift({akun,nama,balance:(Math.random()*100+20).toFixed(2),profit:(Math.random()*10).toFixed(2),expired:exp,sponsor,active:true});document.getElementById('fAkun').value='';document.getElementById('fNama').value='';document.getElementById('fExp').value='';document.getElementById('fSponsor').value='';save();}
function save(){localStorage.setItem('cgc_clients',JSON.stringify(clients));renderClients();}
</script>
</body>
</html>
