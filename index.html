<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGC Admin - Mr Dien Scalper</title>
<style>
:root{--bg:#0a0a1a;--card:#151528;--card2:#1e1e3a;--border:#2a2a4a;--green:#4ade80;--red:#f87171;--text:#e2e8f0;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto}
body{background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.btn-logout{border:1px solid #ef4444;color:#ef4444;background:transparent;padding:6px 18px;border-radius:12px;font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:16px}
.master{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.live-dot{display:flex;align-items:center;gap:6px;color:var(--green);font-weight:600;font-size:14px}
.dot{width:10px;height:10px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.balance-row{display:flex;gap:12px}
.balance-box{flex:1;text-align:center;border-right:1px solid var(--border)}
.balance-box:last-child{border:none}
.balance-box small{color:var(--muted);display:block;margin-bottom:4px;font-size:14px}
.balance-box b{font-size:26px}
.green{color:var(--green)}
.client-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.client-head h2{font-size:22px}
.toggle{position:relative;width:64px;height:32px;background:#333;border-radius:16px;cursor:pointer;transition:.3s}
.toggle.active{background:#22c55e}
.toggle-dot{position:absolute;top:3px;left:3px;width:26px;height:26px;background:#fff;border-radius:50%;transition:.3s}
.toggle.active.toggle-dot{left:35px}
.mini-row{display:flex;gap:12px;margin:12px 0}
.mini{background:var(--card2);border:1px solid var(--border);border-radius:14px;flex:1;padding:12px;text-align:center}
.mini small{display:block;color:var(--muted);font-size:13px}
.mini b{font-size:16px}
.meta{color:var(--muted);font-size:14px;margin:6px 0}
.meta b{color:var(--text)}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:600;cursor:pointer;min-width:80px}
.btn-primary{background:var(--card2)}
.btn-danger{border-color:var(--red);color:var(--red)}
.form-title{font-size:20px;margin:16px 0 12px;font-weight:700}
.input-group{position:relative;margin-bottom:18px}
.input-label{position:absolute;top:-10px;left:12px;background:#a5a6c5;color:#0f0f23;padding:2px 10px;border-radius:8px;font-size:12px;font-weight:700;z-index:2}
.input{width:100%;background:#a5a6c5;border:none;border-radius:14px;padding:16px 14px;font-size:16px;color:#0f0f23;outline:none}
.login-wrap{max-width:400px;margin:80px auto;background:var(--card);padding:24px;border-radius:20px;border:1px solid var(--border)}
.hidden{display:none}
</style>
</head>
<body>
<div id="loginPage" class="login-wrap">
<h2>CGC Admin Login</h2>
<div class="input-group"><span class="input-label">Password Admin</span><input id="passInput" type="password" class="input" placeholder="Masukkan password"></div>
<button class="btn btn-primary" style="width:100%" onclick="doLogin()">Login</button>
<p style="color:var(--muted);font-size:12px;text-align:center;margin-top:12px">Default: admin123 / cgc123</p>
</div>

<div id="dashboard" class="hidden">
<div class="header"><h1>CGC Admin</h1><button class="btn-logout" onclick="doLogout()">Logout</button></div>

<div class="card" id="masterCard">
<div class="master"><h2>Mr Dien master</h2><div class="live-dot"><div class="dot"></div><span id="masterLive">live</span></div></div>
<div class="balance-row">
<div class="balance-box"><small>Balance</small><b id="masterBalance">$0.00</b></div>
<div class="balance-box"><small>Profit today</small><b id="masterProfit" class="green">$0.00</b></div>
</div>
</div>

<div id="clientList"></div>

<div class="form-title">Form Client</div>
<div class="card">
<div class="input-group"><span class="input-label">No Akun</span><input id="fAkun" class="input" placeholder="___ ___ ___ contoh 656895"></div>
<div class="input-group"><span class="input-label">Nama</span><input id="fNama" class="input" placeholder="Robidin"></div>
<div class="input-group"><span class="input-label">Tanggal Expired</span><input id="fExpired" type="date" class="input"></div>
<div class="input-group"><span class="input-label">Sponsor</span><input id="fSponsor" class="input" placeholder="Basri / Belum diisi"></div>
<div class="input-group"><span class="input-label">Balance Awal (optional)</span><input id="fBalance" class="input" placeholder="0"></div>
<div class="actions">
<button class="btn btn-primary" onclick="saveClient()">Add / Update Client</button>
<button class="btn" onclick="clearForm()">Clear</button>
</div>
</div>
<p style="text-align:center;color:var(--muted);font-size:12px;margin:20px">Firebase: mrdien-scalper-default-rtdb.firebaseio.com<br>EA Status: <span id="eaStatus">Checking...</span></p>
</div>

<script>
const FIREBASE_URL = "https://mrdien-scalper-default-rtdb.firebaseio.com";
const ADMIN_PASS = "admin123";

function doLogin(){
const p=document.getElementById('passInput').value;
if(p===ADMIN_PASS||p==="cgc123"||p==="admin"){localStorage.setItem('cgc_login','true');showDashboard();}else alert('Password salah!');
}
function doLogout(){localStorage.removeItem('cgc_login');location.reload();}
function showDashboard(){
document.getElementById('loginPage').classList.add('hidden');
document.getElementById('dashboard').classList.remove('hidden');
loadData();setInterval(loadData,5000);
}
if(localStorage.getItem('cgc_login')==='true'){showDashboard();}

async function loadData(){
try{
const masterRes=await fetch(`${FIREBASE_URL}/masters/MRDIEN_REAL.json`);
const master=await masterRes.json();
if(master){
document.getElementById('masterBalance').innerText=`$${(master.balance||0).toFixed(2)}`;
document.getElementById('masterProfit').innerText=`$${(master.profit_today||master.profit||0).toFixed(2)}`;
document.getElementById('masterLive').innerText=master.live?'live':'offline';
}
const res=await fetch(`${FIREBASE_URL}/clients.json`);
const all=await res.json();
const listDiv=document.getElementById('clientList');
listDiv.innerHTML='';
if(!all){listDiv.innerHTML='<div class=card>Belum ada client</div>';return;}
let entries=Object.entries(all).filter(([k,v])=>v&&(v.balance!==undefined||v.akun));
entries.sort((a,b)=>(b[1].last_update||0)-(a[1].last_update||0));
entries.forEach(([key,c])=>{
if(isNaN(key)){
const hasNum=entries.some(([k2,v2])=>k2===String(c.akun));
if(hasNum) return;
}
const isActive=c.active!==false;
const bal=c.balance||0;
const profit=c.profit_today!==undefined?c.profit_today:(c.profit||0);
const expired=c.expired||'-';
const sponsor=c.sponsor||'Belum diisi';
const nama=c.nama||c.name||key;
const akun=c.akun||key;
const card=document.createElement('div');
card.className='card';
card.innerHTML=`
<div style="color:var(--muted);font-size:13px">Client card</div>
<div class="client-head">
<h2>${nama}</h2>
<div style="display:flex;align-items:center;gap:8px">
<div class="toggle ${isActive?'active':''}" onclick="toggleActive('${key}')"><div class="toggle-dot"></div></div>
<span style="color:${isActive?'#22c55e':'#94a3b8'};font-size:13px;font-weight:600">${isActive?'Active':'Off'}</span>
</div>
</div>
<div class="mini-row">
<div class="mini"><small>Balance</small><b>$${Number(bal).toFixed(2)}</b></div>
<div class="mini"><small>Profit today</small><b>${profit>=0?'+':''}$${Number(profit).toFixed(2)}</b></div>
</div>
<div class="meta">Expired: <b>${expired}</b></div>
<div class="meta">Sponsor: <b>${sponsor}</b> | Akun: <b>${akun}</b> ${c.live?'🟢':''}</div>
<div class="actions">
<button class="btn" onclick="editClient('${key}')">Edit Client</button>
<button class="btn" onclick="perpanjang('${key}')">Perpanjang</button>
<button class="btn btn-danger" onclick="stopSewa('${key}')">Stop Sewa</button>
</div>
`;
listDiv.appendChild(card);
});
document.getElementById('eaStatus').innerText=`OK - ${entries.length} client - Last: ${new Date().toLocaleTimeString()}`;
}catch(e){document.getElementById('eaStatus').innerText='Error: '+e.message;}
}

async function saveClient(){
const akun=document.getElementById('fAkun').value.trim();
const nama=document.getElementById('fNama').value.trim();
const expiredInput=document.getElementById('fExpired').value;
const sponsor=document.getElementById('fSponsor').value.trim()||'Belum diisi';
const balance=parseFloat(document.getElementById('fBalance').value)||0;
if(!akun||!nama){alert('Isi No Akun & Nama!');return;}
let expiredStr=expiredInput? new Date(expiredInput).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '15 Dec 2026';
const payload={akun:akun,nama:nama,name:nama,expired:expiredStr,sponsor:sponsor,balance:balance,profit:0,profit_today:0,equity:balance,active:true,live:false,last_update:Math.floor(Date.now()/1000)};
await fetch(`${FIREBASE_URL}/clients/${akun}.json`,{method:'PUT',body:JSON.stringify(payload)});
await fetch(`${FIREBASE_URL}/clients/${nama}.json`,{method:'PUT',body:JSON.stringify(payload)});
alert(`Client ${nama} (${akun}) disimpan!`);clearForm();loadData();
}
function clearForm(){document.getElementById('fAkun').value='';document.getElementById('fNama').value='';document.getElementById('fExpired').value='';document.getElementById('fSponsor').value='';document.getElementById('fBalance').value='';}
function editClient(key){fetch(`${FIREBASE_URL}/clients/${key}.json`).then(r=>r.json()).then(c=>{document.getElementById('fAkun').value=c.akun||key;document.getElementById('fNama').value=c.nama||c.name||key;document.getElementById('fSponsor').value=c.sponsor||'';document.getElementById('fBalance').value=c.balance||'';window.scrollTo(0,document.body.scrollHeight);});}
async function toggleActive(key){
const res=await fetch(`${FIREBASE_URL}/clients/${key}.json`);const c=await res.json();
const newActive=!(c.active!==false);
await fetch(`${FIREBASE_URL}/clients/${key}.json`,{method:'PATCH',body:JSON.stringify({active:newActive})});
if(c.akun&&c.akun!==key) await fetch(`${FIREBASE_URL}/clients/${c.akun}.json`,{method:'PATCH',body:JSON.stringify({active:newActive})});
loadData();
}
async function perpanjang(key){
const days=prompt('Perpanjang berapa hari?','30');if(!days) return;
const res=await fetch(`${FIREBASE_URL}/clients/${key}.json`);const c=await res.json();
let currentExp=new Date();if(c.expired){const parsed=new Date(c.expired);if(!isNaN(parsed)) currentExp=parsed;}
currentExp.setDate(currentExp.getDate()+parseInt(days));
const expiredStr=currentExp.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
await fetch(`${FIREBASE_URL}/clients/${key}.json`,{method:'PATCH',body:JSON.stringify({expired:expiredStr})});
if(c.akun&&c.akun!==key) await fetch(`${FIREBASE_URL}/clients/${c.akun}.json`,{method:'PATCH',body:JSON.stringify({expired:expiredStr})});
alert(`Diperpanjang sampai ${expiredStr}`);loadData();
}
async function stopSewa(key){
if(!confirm(`Yakin Stop Sewa ${key}?`)) return;
await fetch(`${FIREBASE_URL}/clients/${key}.json`,{method:'PATCH',body:JSON.stringify({active:false,live:false})});
const res=await fetch(`${FIREBASE_URL}/clients/${key}.json`).then(r=>r.json());
if(res&&res.akun&&res.akun!==key) await fetch(`${FIREBASE_URL}/clients/${res.akun}.json`,{method:'PATCH',body:JSON.stringify({active:false,live:false})});
loadData();
}
</script>
</body>
</html>
