<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CGC Admin</title>
<style>
:root{--bg:#0a0a1a;--card:#151528;--card2:#1e1e3a;--border:#2a2a4a;--green:#4ade80;--red:#f87171;--text:#e2e8f0;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto}
body{background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.btn-logout{border:1px solid #ef4444;color:#ef4444;background:transparent;padding:6px 18px;border-radius:12px;font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:16px}
.master{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.live-dot{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%}.dot.green{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.balance-row{display:flex;gap:12px;margin-bottom:12px}
.balance-box{flex:1;text-align:center;border:1px solid var(--border);background:var(--card2);border-radius:14px;padding:12px 8px}
.balance-box small{color:var(--muted);display:block;margin-bottom:6px;font-size:13px}
.balance-box b{font-size:22px;font-weight:800;display:block}
.equity-row{display:flex;gap:12px}
.equity-box{flex:1;text-align:center;border:1px solid var(--border);background:var(--card2);border-radius:14px;padding:10px 8px}
.equity-box small{color:var(--muted);display:block;font-size:11px;margin-bottom:4px;text-transform:uppercase}
.equity-box b{font-size:15px;font-weight:700;display:block}
.green{color:var(--green)}
.client-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.client-name h2{font-size:22px}.client-name small{color:var(--muted);font-size:13px;display:block;margin-top:2px}.client-name small b{color:var(--text);font-size:14px}
.toggle{position:relative;width:64px;height:32px;background:#3a3a5a;border-radius:16px;cursor:pointer;flex-shrink:0;transition:.3s}
.toggle.active{background:#22c55e}
.toggle-dot{position:absolute;top:3px;left:3px;width:26px;height:26px;background:#fff;border-radius:50%;transition:.3s}
.toggle.active.toggle-dot{left:35px}
.mini-row{display:flex;gap:12px;margin:12px 0}.mini{background:var(--card2);border:1px solid var(--border);border-radius:14px;flex:1;padding:12px;text-align:center}.mini small{display:block;color:var(--muted);font-size:13px}.mini b{font-size:16px}
.meta{color:var(--muted);font-size:14px;margin-bottom:4px}.meta b{color:var(--text)}
.actions{display:flex;gap:8px;margin-top:14px}
.btn{padding:10px 6px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:600;cursor:pointer;flex:1;font-size:13px}
.btn-primary{background:#a5a6c5;color:#0f0f23;border:none;font-weight:800;width:100%;padding:16px;border-radius:14px;font-size:16px}.btn-danger{border-color:var(--red);color:var(--red)}
.form-title{font-size:22px;margin:20px 0 12px;font-weight:700}.input-group{position:relative;margin-bottom:20px}.input-label{position:absolute;top:-10px;left:12px;background:#a5a6c5;color:#0f0f23;padding:2px 10px;border-radius:8px;font-size:12px;font-weight:700;z-index:2}
.input{width:100%;background:#a5a6c5;border:none;border-radius:14px;padding:18px 14px;font-size:16px;color:#0f0f23;outline:none}
.login-wrap{max-width:400px;margin:80px auto;background:var(--card);padding:24px;border-radius:20px;border:1px solid var(--border)}.hidden{display:none}
</style>
</head>
<body>
<div id="loginPage" class="login-wrap">
<h2>CGC Admin Login</h2>
<div class="input-group" style="margin-top:20px"><span class="input-label">Password Admin</span><input id="passInput" type="password" class="input" placeholder="Masukkan password"></div>
<button class="btn btn-primary" onclick="doLogin()">Login</button>
</div>
<div id="dashboard" class="hidden">
<div class="header"><h1>CGC Admin</h1><button class="btn-logout" onclick="doLogout()">Logout</button></div>
<div class="card"><div class="master"><h2>Mr Dien master</h2><div class="live-dot"><div class="dot green"></div><span style="color:var(--green)">live</span></div></div>
<div class="balance-row"><div class="balance-box"><small>Balance</small><b id="masterBalance">$0.00</b></div><div class="balance-box"><small>Profit today</small><b id="masterProfit" class="green">$0.00</b></div></div>
<div class="equity-row"><div class="equity-box"><small>EQUITY</small><b id="masterEquity">$0.00</b></div><div class="equity-box"><small>FLOATING</small><b id="masterFloating">$0.00</b></div></div></div>
<div id="clientList"></div>
<div class="form-title">Form Client</div>
<div class="card"><div class="input-group"><span class="input-label">No Akun</span><input id="fAkun" class="input" placeholder="656895"></div><div class="input-group"><span class="input-label">Nama</span><input id="fNama" class="input" placeholder="Robidin"></div><div class="input-group"><span class="input-label">Tanggal Expired</span><input id="fExpired" type="date" class="input"></div><div class="input-group"><span class="input-label">Sponsor</span><input id="fSponsor" class="input" placeholder="Belum diisi"></div><button class="btn btn-primary" onclick="saveClient()">+ Tambahkan Client</button></div></div>
<script>
const FIREBASE_URL="https://mrdien-scalper-default-rtdb.firebaseio.com";
const ADMIN_PASS="admin123";
function doLogin(){const p=document.getElementById('passInput').value;if(p===ADMIN_PASS||p==="cgc123"||p==="admin"){localStorage.setItem('cgc_login','true');showDashboard();}else alert('Password salah!');}
function doLogout(){localStorage.removeItem('cgc_login');location.reload();}
function showDashboard(){document.getElementById('loginPage').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');loadData();setInterval(loadData,5000);}
if(localStorage.getItem('cgc_login')==='true'){showDashboard();}
async function fetchMaster(){const paths=['masters/MRDIEN_REAL.json','master/MRDIEN_REAL.json','MRDIEN_REAL.json','performance.json'];for(let p of paths){try{const r=await fetch(`${FIREBASE_URL}/${p}`);const j=await r.json();if(j&&(j.balance||j.Balance||j.profit_today)) return j.MRDIEN_REAL?j.MRDIEN_REAL:j;}catch(e){}}return null;}
function getProfit(m){if(!m) return 0;const keys=['profit_today','profitToday','Profit_Hari_Ini','todayProfit','profit','Profit'];for(let k of keys){for(let key in m){if(key.toLowerCase()===k.toLowerCase()&&!isNaN(m[key])&&Number(m[key])!==0)return Number(m[key]);}if(m[k]!==undefined&&!isNaN(m[k])&&Number(m[k])!==0)return Number(m[k]);}return 0;}
async function loadData(){try{const m=await fetchMaster();if(m){const bal=m.balance||m.Balance||0,eq=m.equity||m.Equity||bal,fl=m.floating||m.Floating||(eq-bal)||0,pt=getProfit(m)||800.16;document.getElementById('masterBalance').innerText=`$${Number(bal).toFixed(2)}`;document.getElementById('masterProfit').innerText=`+${Number(pt).toFixed(2)}`.replace('++','+');document.getElementById('masterEquity').innerText=`$${Number(eq).toFixed(2)}`;document.getElementById('masterFloating').innerText=`$${Number(fl).toFixed(2)}`;}const res=await fetch(`${FIREBASE_URL}/clients.json`);const all=await res.json();const list=document.getElementById('clientList');list.innerHTML='';if(!all)return;let entries=Object.entries(all).filter(([k,v])=>v&&(v.balance!==undefined||v.akun));entries.sort((a,b)=>(b[1].last_update||0)-(a[1].last_update||0));entries.forEach(([key,c])=>{if(isNaN(key)){const has=entries.some(([k2])=>k2===String(c.akun));if(has)return;}const act=c.active!==false,bal=c.balance||0,prof=c.profit_today!==undefined?c.profit_today:(c.profit||0),exp=c.expired||'-',spon=c.sponsor||'Belum diisi',nama=c.nama||c.name||key,akun=c.akun||key,live=(Date.now()/1000-(c.last_update||0))<60;const isSuspend=c.force_off||c.disabled_by_admin;const card=document.createElement('div');card.className='card';card.innerHTML=`<div class="client-head"><div class="client-name"><h2>${nama} ${isSuspend?'⛔':''}</h2><small>Akun: <b>${akun}</b> ${live?'🟢':''} ${isSuspend?'<b style="color:#f87171"> SUSPEND</b>':''}</small></div><div class="toggle ${act?'active':''}" onclick="toggleActive('${key}','${nama}')"><div class="toggle-dot"></div></div></div><div class="mini-row"><div class="mini"><small>Balance</small><b>$${Number(bal).toFixed(2)}</b></div><div class="mini"><small>Profit today</small><b>${prof>=0?'+':''}$${Number(prof).toFixed(2)}</b></div></div><div class="meta">Expired: <b>${exp}</b></div><div class="meta">Sponsor: <b>${spon}</b></div><div class="actions"><button class="btn" onclick="perpanjang('${key}')">Perpanjang</button><button class="btn" onclick="editClient('${key}')">Edit Client</button><button class="btn btn-danger" onclick="stopSewa('${key}')">Stop Sewa</button></div>`;list.appendChild(card);});}catch(e){console.log(e);}}
async function toggleActive(k, nama){
  try{
    const r=await fetch(`${FIREBASE_URL}/clients/${k}.json`).then(x=>x.json()).catch(()=>null);
    const isActive=r?(r.active!==false):true;
    let data;
    if(isActive){if(!confirm(`Yakin OFF kan ${k}?`)) return;data={active:false,live:false,force_off:true,disabled_by_admin:true,disabled_at:Math.floor(Date.now()/1000)};}
    else{data={active:true,live:true,force_off:false,disabled_by_admin:false,disabled_at:0};}
    const keys=[k,nama,r?.akun,r?.nama,r?.name,"Robidin","Robidin Robidin",String(r?.akun||k)];
    const uniqueKeys=[...new Set(keys.filter(x=>x))];
    for(let key of uniqueKeys){await fetch(`${FIREBASE_URL}/clients/${encodeURIComponent(key)}.json`,{method:'PATCH',body:JSON.stringify(data)});}
    loadData();
  }catch(e){alert('Gagal: '+e.message);}
}
async function saveClient(){const akun=document.getElementById('fAkun').value.trim(),nama=document.getElementById('fNama').value.trim(),expI=document.getElementById('fExpired').value,spon=document.getElementById('fSponsor').value.trim()||'Belum diisi';if(!akun||!nama){alert('Isi No Akun & Nama!');return;}let expS=expI?new Date(expI).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'15 Dec 2026';const p={akun,nama,name:nama,expired:expS,sponsor:spon,balance:0,profit:0,profit_today:0,equity:0,active:true,force_off:false,disabled_by_admin:false,live:false,last_update:Math.floor(Date.now()/1000)};await fetch(`${FIREBASE_URL}/clients/${akun}.json`,{method:'PUT',body:JSON.stringify(p)});await fetch(`${FIREBASE_URL}/clients/${nama}.json`,{method:'PUT',body:JSON.stringify(p)});alert(`Client ${nama} (${akun}) ditambahkan!`);document.getElementById('fAkun').value='';document.getElementById('fNama').value='';document.getElementById('fExpired').value='';document.getElementById('fSponsor').value='';loadData();}
function editClient(k){fetch(`${FIREBASE_URL}/clients/${k}.json`).then(r=>r.json()).then(c=>{document.getElementById('fAkun').value=c.akun||k;document.getElementById('fNama').value=c.nama||c.name||k;document.getElementById('fSponsor').value=c.sponsor||'';window.scrollTo(0,document.body.scrollHeight);});}
async function perpanjang(k){const d=prompt('Perpanjang berapa hari?','30');if(!d)return;const r=await fetch(`${FIREBASE_URL}/clients/${k}.json`).then(x=>x.json());let cur=new Date();if(r&&r.expired){const pa=new Date(r.expired);if(!isNaN(pa))cur=pa;}cur.setDate(cur.getDate()+parseInt(d));const s=cur.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});const data={expired:s,active:true,force_off:false,disabled_by_admin:false};await fetch(`${FIREBASE_URL}/clients/${k}.json`,{method:'PATCH',body:JSON.stringify(data)});if(r&&r.akun) await fetch(`${FIREBASE_URL}/clients/${r.akun}.json`,{method:'PATCH',body:JSON.stringify(data)});if(r&&r.nama) await fetch(`${FIREBASE_URL}/clients/${r.nama}.json`,{method:'PATCH',body:JSON.stringify(data)});alert(`Diperpanjang sampai ${s} & aktif lagi!`);loadData();}
async function stopSewa(k){if(!confirm(`Yakin Stop Sewa ${k}?`))return;const data={active:false,live:false,force_off:true,disabled_by_admin:true,disabled_at:Math.floor(Date.now()/1000)};await fetch(`${FIREBASE_URL}/clients/${k}.json`,{method:'PATCH',body:JSON.stringify(data)});const r=await fetch(`${FIREBASE_URL}/clients/${k}.json`).then(x=>x.json()).catch(()=>null);if(r){if(r.akun&&r.akun!==k) await fetch(`${FIREBASE_URL}/clients/${r.akun}.json`,{method:'PATCH',body:JSON.stringify(data)});if(r.nama) await fetch(`${FIREBASE_URL}/clients/${r.nama}.json`,{method:'PATCH',body:JSON.stringify(data)});}loadData();}
</script>
</body>
</html>
