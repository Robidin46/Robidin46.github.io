<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRDIEN SCALPER - LIVE TRADING</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'JetBrains Mono',monospace;background:#05070a;color:#fff}
.orbitron{font-family:'Orbitron',sans-serif}
.live-dot{animation:blink 1s infinite} @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body class="p-4">
<div class="max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-6 border-b border-cyan-500/30 pb-4">
    <h1 class="orbitron text-2xl font-black text-cyan-400">MRDIEN <span class="text-white">LIVE</span></h1>
    <div class="flex items-center gap-2 bg-green-500/20 px-3 py-1 rounded-full border border-green-500">
      <div class="w-2 h-2 bg-green-400 rounded-full live-dot"></div>
      <span class="text-xs font-bold text-green-400">LIVE FROM MT5 VPS</span>
    </div>
  </div>

  <div id="loading" class="text-center py-20 text-cyan-400">Menunggu sinyal dari VPS...</div>
  <div id="dashboard" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-gray-900 p-4 rounded-xl border border-cyan-500/20"><p class="text-xs text-gray-500">BALANCE</p><h2 id="balance" class="text-2xl font-bold text-white">$0</h2></div>
    <div class="bg-gray-900 p-4 rounded-xl border border-green-500/20"><p class="text-xs text-gray-500">EQUITY</p><h2 id="equity" class="text-2xl font-bold text-green-400">$0</h2></div>
    <div class="bg-gray-900 p-4 rounded-xl border border-yellow-500/20"><p class="text-xs text-gray-500">FLOATING PnL</p><h2 id="pnl" class="text-2xl font-bold">$0</h2></div>
    <div class="md:col-span-3 bg-gray-900 p-4 rounded-xl border border-white/10">
      <p class="text-xs text-gray-500 mb-2">OPEN POSITIONS</p>
      <div id="positions" class="space-y-2 text-sm"></div>
    </div>
    <div class="md:col-span-3 text-center text-xs text-gray-600">Akun: <span id="acc"></span> | Last Update: <span id="time"></span> | Server: <span id="server"></span></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDVXzrd6p8VFvdvyWpTmFhh5PeKAjOOJUA",
  authDomain: "mrdien-scalper.firebaseapp.com",
  databaseURL: "https://mrdien-scalper-default-rtdb.firebaseio.com",
  projectId: "mrdien-scalper",
  storageBucket: "mrdien-scalper.firebasestorage.app",
  messagingSenderId: "121330820516",
  appId: "1:121330820516:web:1a53fe95a6d326e7270d31"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// GANTI 12345 DENGAN NOMOR AKUN MT5 LU NANTI
const ACCOUNT_ID = "LIVE_MAIN"; 
const liveRef = ref(db, 'live/' + ACCOUNT_ID);

onValue(liveRef, (snapshot) => {
  const data = snapshot.val();
  if(!data) return;
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  
  document.getElementById('balance').innerText = '$' + data.balance;
  document.getElementById('equity').innerText = '$' + data.equity;
  document.getElementById('pnl').innerText = '$' + data.profit;
  document.getElementById('pnl').className = 'text-2xl font-bold ' + (parseFloat(data.profit) >= 0 ? 'text-green-400' : 'text-red-400');
  document.getElementById('acc').innerText = data.account;
  document.getElementById('time').innerText = data.time;
  document.getElementById('server').innerText = data.server;

  let posHtml = '';
  if(data.positions && data.positions.length > 0){
    data.positions.forEach(p => {
      posHtml += `<div class="flex justify-between bg-black/50 p-2 rounded"><span class="${p.type=='BUY'?'text-blue-400':'text-red-400'}">${p.type} ${p.symbol} ${p.lot}</span><span class="${parseFloat(p.profit)>=0?'text-green-400':'text-red-400'}">${p.profit}$</span></div>`;
    });
  } else { posHtml = '<p class="text-gray-500">No open positions</p>'; }
  document.getElementById('positions').innerHTML = posHtml;
});
</script>
</body>
</html>
